name: Build and Deploy

on:
  workflow_dispatch:   # MANUAL ONLY — avoids burning free-tier CI minutes on every push

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Android keystore
        run: |
          mkdir -p android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks
        working-directory: app

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF
        working-directory: app

      - name: Guard pbxproj integrity
        run: ./tools/check_pbxproj.sh
        working-directory: .

      - name: Install dependencies
        run: flutter pub get
        working-directory: app

      - name: Verify no debug artifacts shipped
        run: |
          if grep -rn "TODO\|FIXME" lib/ --include="*.dart"; then
            echo "::error::TODO/FIXME markers found in lib/ — not allowed in shipped code"
            exit 1
          fi
        working-directory: app

      - name: Analyze
        run: flutter analyze
        working-directory: app

      - name: Run tests
        run: flutter test
        working-directory: app

      - name: Build AAB (Play Store submission)
        run: |
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols
        working-directory: app

      - name: Build APK (direct sideload testing)
        run: |
          flutter build apk --release \
            --obfuscate --split-debug-info=build/symbols
        working-directory: app

      - name: Cleanup signing credentials
        if: always()
        run: |
          rm -f android/key.properties android/app/upload-keystore.jks
        working-directory: app

      - uses: actions/upload-artifact@v4
        with:
          name: atrament-amazon-aab
          path: app/build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: atrament-amazon-apk
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: atrament-amazon-debug-symbols
          path: app/build/symbols/
          if-no-files-found: warn
