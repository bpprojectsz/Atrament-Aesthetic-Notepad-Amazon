plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and
    // Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Signing config: key.properties is never committed (see .gitignore).
// CI environments (Codemagic/GitHub Actions) inject the keystore and this
// file at build time via secure environment variables — see the
// respective workflow's signing step documentation before your first
// release build.
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.zdmgold.atrament"

    // Overridden above Flutter's own dynamic defaults: several plugin
    // dependencies (flutter_plugin_android_lifecycle, and NDK
    // requirements from device_info_plus, file_picker,
    // flutter_local_notifications, google_mobile_ads, and others) need a
    // higher SDK/NDK than flutter.compileSdkVersion/flutter.ndkVersion
    // resolve to on this Flutter version. Values below are copied
    // directly from the Gradle build output's own "Fix this issue by
    // adding..." instructions, not guessed.
    compileSdk = 36
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // flutter_local_notifications v10+ uses java.time APIs
        // internally for scheduling and requires desugaring to be
        // enabled even for apps that don't touch java.time directly —
        // confirmed against the package's own pub.dev documentation.
        coreLibraryDesugaringEnabled = true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = "com.zdmgold.atrament"
        minSdk = 21 // Section 1: Android 6.0+ (API 21)
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            // Falls back to debug signing only when key.properties is
            // absent (e.g. a first local build before secrets are set
            // up) — CI always provides real signing credentials before
            // producing a release artifact intended for the store.
            signingConfig = keystorePropertiesFile.exists()
                ? signingConfigs.release
                : signingConfigs.debug
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix = ".debug"
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation 'androidx.multidex:multidex:2.0.1'
    // Required by coreLibraryDesugaringEnabled above.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // Amazon Appstore SDK IAP — pinned to 3.0.4 (see project notes).
    // 3.0.5 through 3.0.9 throw "Resource already registered" inside
    // PurchasingService.registerListener on FlutterActivity-based apps.
    // Amazon staff confirmed 3.0.4 remains supported for production.
    implementation 'com.amazon.device:amazon-appstore-sdk:3.0.4'
}
