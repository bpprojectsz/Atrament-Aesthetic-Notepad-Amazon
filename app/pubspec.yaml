name: atrament
description: A premium, distraction-free notepad with paper textures and daily ambient scripture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.47.0 <3.48.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Rich text editor
  flutter_quill: ^11.6.0

  # Local persistence
  sqflite: ^2.3.3+1
  # Bundles a modern SQLite build (with FTS5, R-tree, JSON1) for
  # Android/iOS, since the device's own system SQLite isn't guaranteed
  # to include FTS5 — several Android manufacturers/OS builds ship
  # without it, which sqflite alone can't work around.
  sqlite3_flutter_libs: ^0.6.0+eol
  # Now also a production dependency, not just a test one: local_storage.dart
  # explicitly routes through databaseFactoryFfi at runtime (see the comment
  # there) so notes/notebooks work correctly even on Android builds whose
  # system SQLite lacks FTS5.
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

  # Export / sharing
  share_plus: ^13.3.0
  file_picker: ^13.1.0
  url_launcher: ^6.3.2
  pdf: ^3.11.0
  screenshot: ^3.0.0

  # Monetization
  google_mobile_ads: ^9.1.0

  # Engagement (review prompt + iOS ATT)

  # Security
  local_auth: ^3.0.2

  # Notifications
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1

  # Formatting / i18n
  intl: ^0.20.3

  # Fonts (Inter, Lora — fetched and cached on first use)
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0
  flutter_native_splash: ^2.4.1
  # Used directly in test files to fake path_provider's platform channel.
  # `any` rather than a pinned version: both already resolve transitively
  # through path_provider/sqflite_common_ffi, so this just satisfies the
  # analyzer's depend_on_referenced_packages lint without risking a
  # version conflict against whatever's already resolved.
  path_provider_platform_interface: any
  plugin_platform_interface: any

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/paper_textures/
    - assets/json/

  fonts:
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
        - asset: assets/fonts/Merriweather-Bold.ttf
          weight: 700
        - asset: assets/fonts/Merriweather-Italic.ttf
          style: italic

# flutter_native_splash configuration (Section 10)
flutter_native_splash:
  color: "#F5F1E8"
  image: assets/images/splash_logo.png
  color_dark: "#1A1612"
  image_dark: assets/images/splash_logo.png
  android_12:
    color: "#F5F1E8"
    image: assets/images/splash_logo.png
    color_dark: "#1A1612"
    image_dark: assets/images/splash_logo.png

# flutter_launcher_icons configuration.
# Source: assets/images/icon_source.png (1024x1024, opaque, rendered from logo.svg).
# Regenerate the source PNG via tools/generate_assets.sh before running
# `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/icon_source.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#F5F1E8"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
